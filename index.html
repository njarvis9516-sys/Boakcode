<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boakcode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div class="logo"><span class="logo-mark">B</span>Boakcode</div>
    <nav class="file-menu">
      <button id="btn-new" type="button">New</button>
      <button id="btn-open" type="button">Load</button>
      <button id="btn-save" type="button" title="Download project file">Save</button>
      <input id="file-input" type="file" accept=".json,.boak" hidden>
    </nav>
    <input id="project-title" class="project-title" aria-label="Project title" spellcheck="false">
  </header>

  <main id="app" data-tab="code">
    <div id="tabs" role="tablist" aria-label="Editor">
      <button type="button" role="tab" data-tab="code" aria-selected="true">🧩 Code</button>
      <button type="button" role="tab" data-tab="costumes" aria-selected="false" tabindex="-1">🖌 Costumes</button>
      <button type="button" role="tab" data-tab="sounds" aria-selected="false" tabindex="-1">🔊 Sounds</button>
    </div>
    <nav id="categories" aria-label="Block categories"></nav>
    <div id="palette" aria-label="Blocks"></div>

    <section id="ws-wrap">
      <div id="workspace">
        <div id="ws-canvas"></div>
      </div>
      <div id="ws-hint">Drag blocks here to build a script.<br>Click a script to run it.</div>
      <div class="ws-tools">
        <button id="btn-cleanup" type="button" title="Tidy up scripts">Clean up</button>
      </div>
    </section>

    <section id="costumes-panel" class="media-panel" aria-label="Costumes" hidden></section>
    <section id="sounds-panel" class="media-panel" aria-label="Sounds" hidden></section>

    <aside id="stage-col">
      <div class="stage-bar">
        <button id="btn-flag" class="icon-btn" type="button" title="Go (green flag)">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3v18" stroke="#3d7a1f" stroke-width="2" stroke-linecap="round"/><path d="M6 4c3-2 6 2 9 0s4-1 4-1v9s-1-1-4 1-6-2-9 0z" fill="#4cbf56" stroke="#3d7a1f" stroke-width="1.2" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-stop" class="icon-btn" type="button" title="Stop">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z" fill="#ec5959" stroke="#b84848" stroke-width="1.2"/></svg>
        </button>
        <span class="spacer"></span>
        <span id="mouse-coords">x: 0 &nbsp;y: 0</span>
      </div>
      <div id="stage-wrap">
        <canvas id="stage" width="960" height="720"></canvas>
        <form id="ask-box" hidden>
          <input id="ask-input" autocomplete="off" aria-label="Answer">
          <button type="submit" aria-label="Submit answer">✓</button>
        </form>
      </div>

      <div id="sprite-info">
        <label>Sprite <input id="si-name" spellcheck="false"></label>
        <label>x <input id="si-x" class="num" inputmode="decimal"></label>
        <label>y <input id="si-y" class="num" inputmode="decimal"></label>
        <label>Size <input id="si-size" class="num" inputmode="decimal"></label>
        <label>Direction <input id="si-dir" class="num" inputmode="decimal"></label>
        <label class="check"><input id="si-show" type="checkbox"> Show</label>
      </div>
      <div id="sprite-list"></div>
    </aside>
  </main>

  <div id="drag-layer"></div>
  <div id="drop-line"></div>
  <div id="ctx-menu" hidden></div>

  <script src="extensions.js"></script>
  <script src="media.js"></script>
  <script src="app.js"></script>
</body>
</html>
